  </text>
  
  <!-- Badge -->
  <rect x="100" y="310" width="200" height="60" rx="5" fill="#fff" opacity="0.9"/>
  <text x="200" y="348" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#2E7D32">
